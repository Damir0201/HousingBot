x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-domik}:${POSTGRES_PASSWORD:-domik}@postgres:5432/${POSTGRES_DB:-domik}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    EXCEL_PATH: /app/data/properties.xlsx
  volumes:
    - excel_data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domik}
      POSTGRES_DB: ${POSTGRES_DB:-domik}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Long polling for local development. In production set BOT_MODE=webhook
  # and remove this service: updates will arrive at api:/webhook/telegram.
  bot:
    <<: *app
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=4"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *app
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  excel_data:
